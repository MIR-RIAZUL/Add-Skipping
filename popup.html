<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdFast</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="#FF0033" />
          <path d="M10 8L16 12L10 16V8Z" fill="white" />
        </svg>
        <span class="brand-name">AdFast</span>
      </div>
      <div id="statusPill" class="status-pill active">
        <span class="dot"></span>
        <span id="statusText">Active</span>
      </div>
    </header>

    <!-- Main Counter -->
    <section class="counter-box">
      <div id="adsCount" class="counter-num">0</div>
      <div class="counter-label">Ads Blocked</div>
    </section>

    <!-- Feature Toggles -->
    <section class="toggles">
      <div class="toggle-row">
        <div class="toggle-text">
          <div class="toggle-title">Block Ads</div>
          <div class="toggle-sub">Video ads & banners</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="enableToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <div class="toggle-text">
          <div class="toggle-title">Hide Shorts</div>
          <div class="toggle-sub">Feed shelves & reels</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="shortsToggle">
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- Footer Actions -->
    <footer class="footer">
      <button id="resetBtn" class="reset-btn" type="button" title="Reset stats to 0">
        <svg class="reset-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
        </svg>
        <span id="resetBtnText">Reset stats</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
