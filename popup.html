<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdFast Control Panel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 4L14 12L5 20V4Z" fill="white"/>
            <path d="M12 4L21 12L12 20V4Z" fill="white"/>
            <rect x="20" y="4" width="2.5" height="16" rx="1" fill="white"/>
          </svg>
        </div>
        <div class="title-meta">
          <h1 class="brand-title">AdFast <span class="badge">PRO</span></h1>
          <p class="brand-subtitle">YouTube™ Ad Eliminator</p>
        </div>
      </div>
      <div id="statusPill" class="status-pill active">
        <span class="status-dot"></span>
        <span id="statusText" class="status-label">Active</span>
      </div>
    </header>

    <!-- Main Stat Card -->
    <div class="stat-card">
      <div class="stat-glow"></div>
      <div class="stat-header">
        <span class="stat-title">Total Ads Bypassed</span>
        <span class="stat-tag">Stealth Mode</span>
      </div>
      <div class="stat-number-wrapper">
        <div id="adsCount" class="stat-number">0</div>
        <div class="stat-unit">ads</div>
      </div>
      <div class="stat-footer">
        <svg class="shield-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2.001A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd" />
        </svg>
        <span>Zero anti-adblock detection triggers</span>
      </div>
    </div>

    <!-- Toggle Controls List -->
    <div class="controls-list">
      <!-- Master Toggle -->
      <div class="control-item">
        <div class="control-info">
          <div class="control-name">Ad Skipping & Banners</div>
          <div class="control-desc">Instant bypass and cosmetic banner removal</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="enableToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Shorts Toggle -->
      <div class="control-item">
        <div class="control-info">
          <div class="control-name">Hide YouTube Shorts</div>
          <div class="control-desc">Remove Shorts shelves from home & search</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="shortsToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Actions & Reset -->
    <div class="action-row">
      <button id="resetBtn" class="reset-button" type="button" title="Reset total ads counter">
        <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
        </svg>
        <span id="resetBtnText">Reset Counter</span>
      </button>
    </div>

    <!-- Footer Note -->
    <footer class="footer">
      <div class="status-indicator-sub">
        <span class="pulse-dot"></span> High-Speed Player Acceleration
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
